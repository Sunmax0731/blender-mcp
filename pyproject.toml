[project]
name = "blender-mcp-server"
version = "1.2.0"
description = "MCP server scaffold for Blender integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0,<1.0.0",
    "jsonschema>=4.20.0,<5.0.0",
    "mcp>=1.0.0,<2.0.0",
    "pillow>=11.3.0,<12.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "starlette>=0.38.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.16.0,<7.0.0",
    "pytest>=8.0.0,<9.0.0",
]

[project.scripts]
blender-mcp-server = "blender_mcp_server.main:main"
blender-mcp-installer = "blender_mcp_installer.main:main"
blender-precision-mcp = "blender_precision_mcp.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
