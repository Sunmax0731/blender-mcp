approved_addons:
  - module: example_retopology_addon
    display_name: Example Retopology Add-on
    version_constraint: ">=1.0,<2.0"
    license_status: verified
    allowed_operations: [retopology]
    operators:
      - idname: object.example_retopology
        label: Example Retopology
        context:
          mode: OBJECT
          requires_active_object: true
          requires_selected_objects: true
          requires_view3d: false
        destructive: true
        backup_required: true
        property_map:
          target_face_count: target_count
          preserve_boundaries: preserve_boundary
    validation:
      min_quad_ratio: 0.85
      max_non_manifold_edges: 0
  - module: VRM_Addon_for_Blender-release
    display_name: VRM Add-on for Blender
    version_constraint: ">=3.26,<4.0"
    license_status: verified
    allowed_operations: [import_base_character_vrm]
    operators:
      - idname: import_scene.vrm
        label: Import VRM
        context:
          mode: OBJECT
          requires_active_object: false
          requires_selected_objects: false
          requires_view3d: false
        destructive: false
        backup_required: false
        property_map:
          filepath: filepath
          extract_textures_into_folder: extract_textures_into_folder
          make_new_texture_folder: make_new_texture_folder
    validation:
      required_object_types: [ARMATURE, MESH]
